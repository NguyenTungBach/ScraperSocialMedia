# Gửi email alert hot/trend — chạy TRỰC TIẾP trên GitHub runner (không gọi Render).
# Lý do: Render free thường timeout Gmail SMTP; runner GitHub gửi mail ổn hơn.
#
# BẮT BUỘC — Settings → Secrets and variables → Actions → Variables:
#   DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
#   MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM_ADDRESS, MAIL_MAIN
#   GEMINI_API_KEY
#
# Tuỳ chọn Variables:
#   MAIL_PORT (mặc định 587), MAIL_ALERT_BCC, DB_SSL (mặc định true)
#   APP_NAME, GEMINI_MODEL, ALERT_HOT_THRESHOLD, ALERT_TREND_THRESHOLD
#
# Chạy: Actions → "Alert Gmail" → Run workflow

name: Alert Gmail

on:
  workflow_dispatch:
    inputs:
      subject_id:
        description: 'Chỉ kiểm tra 1 subject (để trống = tất cả)'
        required: false
        type: string
      to:
        description: 'Override email người nhận (mặc định MAIL_MAIN)'
        required: false
        type: string
      bcc:
        description: 'BCC thêm, phân cách bằng dấu phẩy'
        required: false
        type: string

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend-express

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-express/package-lock.json

      - name: Check required variables
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASSWORD }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ vars.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          MAIL_MAIN: ${{ vars.MAIL_MAIN }}
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for key in DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD \
            MAIL_HOST MAIL_USERNAME MAIL_PASSWORD MAIL_FROM_ADDRESS MAIL_MAIN \
            GEMINI_API_KEY; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions → Variables"
            echo "Copy values from backend-express/.env (DB_* / MAIL_* / GEMINI_API_KEY)."
            exit 1
          fi
          echo "All required variables are present."

      - name: Install dependencies
        run: npm ci

      - name: Run alert Gmail
        env:
          NODE_ENV: production
          APP_NAME: ${{ vars.APP_NAME || 'ScraperSocialMedia' }}
          DB_CONNECTION: mysql
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '19437' }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASSWORD }}
          DB_SSL: ${{ vars.DB_SSL || 'true' }}
          MAIL_MAILER: smtp
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ vars.MAIL_PASSWORD }}
          MAIL_ENCRYPTION: tls
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          MAIL_MAIN: ${{ vars.MAIL_MAIN }}
          MAIL_ALERT_BCC: ${{ vars.MAIL_ALERT_BCC }}
          GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite' }}
          ALERT_HOT_THRESHOLD: ${{ vars.ALERT_HOT_THRESHOLD || '8000' }}
          ALERT_TREND_THRESHOLD: ${{ vars.ALERT_TREND_THRESHOLD || '5000' }}
          ALERT_SUBJECT_ID: ${{ inputs.subject_id }}
          ALERT_TO: ${{ inputs.to }}
          ALERT_BCC: ${{ inputs.bcc }}
        run: npm run app:alert-gmail
