# Gửi email alert hot/trend — chạy TRỰC TIẾP trên GitHub runner (không gọi Render).
# Lý do: Render free thường timeout Gmail SMTP; runner GitHub gửi mail ổn hơn.
#
# Cấu hình Secrets (Settings → Secrets and variables → Actions → Secrets):
#   DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
#   MAIL_FROM_ADDRESS, MAIL_MAIN
#   GEMINI_API_KEY
#
# Tuỳ chọn Secrets / Variables:
#   DB_SSL=true (Variable), GEMINI_MODEL, ALERT_HOT_THRESHOLD, ALERT_TREND_THRESHOLD
#   MAIL_ALERT_BCC, APP_NAME
#
# Chạy: Actions → "Alert Gmail" → Run workflow

name: Alert Gmail

on:
  workflow_dispatch:
    inputs:
      subject_id:
        description: 'Chỉ kiểm tra 1 subject (để trống = tất cả)'
        required: false
        type: string
      to:
        description: 'Override email người nhận (mặc định MAIL_MAIN)'
        required: false
        type: string
      bcc:
        description: 'BCC thêm, phân cách bằng dấu phẩy'
        required: false
        type: string

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend-express

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend-express/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run alert Gmail
        env:
          NODE_ENV: production
          APP_NAME: ${{ vars.APP_NAME || 'ScraperSocialMedia' }}
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: ${{ vars.DB_SSL || 'true' }}
          MAIL_MAILER: smtp
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION: tls
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_MAIN: ${{ secrets.MAIL_MAIN }}
          MAIL_ALERT_BCC: ${{ secrets.MAIL_ALERT_BCC }}
          GEMINI_ENABLED: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash,gemini-3.5-flash-lite' }}
          ALERT_HOT_THRESHOLD: ${{ vars.ALERT_HOT_THRESHOLD || '8000' }}
          ALERT_TREND_THRESHOLD: ${{ vars.ALERT_TREND_THRESHOLD || '5000' }}
          ALERT_TOP_VIDEOS_PER_SUBJECT: ${{ vars.ALERT_TOP_VIDEOS_PER_SUBJECT || '10' }}
          ALERT_SUBJECT_ID: ${{ inputs.subject_id }}
          ALERT_TO: ${{ inputs.to }}
          ALERT_BCC: ${{ inputs.bcc }}
        run: npm run app:alert-gmail
