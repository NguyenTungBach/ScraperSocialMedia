# Cào video YouTube mỗi 2 giờ — chạy TRỰC TIẾP trên GitHub runner (không gọi Render).
# Lý do: tránh timeout / cold-start Render free khi scrape nhiều kênh + comment.
#
# BẮT BUỘC — Settings → Secrets and variables → Actions → Variables:
#   DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD
#   YOUTUBE_API_KEY
#
# Tuỳ chọn Variables:
#   DB_PORT (mặc định 19437), DB_SSL (mặc định true)
#   YOUTUBE_MAX_RESULTS (mặc định 10)
#   YOUTUBE_CHANNEL_IDS (vd. 1,2,3 — trống = tất cả kênh youtube trong DB)
#   YOUTUBE_MAX_TOP_COMMENTS, YOUTUBE_MAX_REPLIES
#
# Chạy: Actions → "YouTube Scraper Cron" → Run workflow

name: YouTube Scraper Cron

on:
  schedule:
    # Mỗi 2 giờ (UTC). GitHub có thể trễ vài phút so với đúng giờ.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      channel_ids:
        description: 'Chỉ cào một số channel_id (vd. 1,2,3 — trống = tất cả)'
        required: false
        type: string

jobs:
  scrape-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend-express

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-express/package-lock.json

      - name: Check required variables
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASSWORD }}
          YOUTUBE_API_KEY: ${{ vars.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for key in DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD YOUTUBE_API_KEY; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions → Variables"
            echo "Copy values from backend-express/.env (DB_* / YOUTUBE_API_KEY)."
            exit 1
          fi
          echo "All required variables are present."

      - name: Install dependencies
        run: npm ci

      - name: Run YouTube scraper
        env:
          NODE_ENV: production
          DB_CONNECTION: mysql
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '19437' }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASSWORD }}
          DB_SSL: ${{ vars.DB_SSL || 'true' }}
          YOUTUBE_API_KEY: ${{ vars.YOUTUBE_API_KEY }}
          YOUTUBE_MAX_RESULTS: ${{ vars.YOUTUBE_MAX_RESULTS || '10' }}
          YOUTUBE_MAX_TOP_COMMENTS: ${{ vars.YOUTUBE_MAX_TOP_COMMENTS || '20' }}
          YOUTUBE_MAX_REPLIES: ${{ vars.YOUTUBE_MAX_REPLIES || '10' }}
          YOUTUBE_CHANNEL_IDS: ${{ inputs.channel_ids || vars.YOUTUBE_CHANNEL_IDS }}
        run: npm run app:youtube-scrape

