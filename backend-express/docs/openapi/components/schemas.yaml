# Schemas dùng chung cho Auth / User
schemas:
  UserStatus:
    title: UserStatus
    description: |
      Status:
      - `1`: on
      - `2`: off
    type: integer
    enum: [1, 2]
  UserType:
    title: UserType
    description: |
      Role:
      - `admin`
      - `driver`
    type: string
    enum: [admin, driver]
  Channel:
    type: object
    properties:
      id: { type: integer }
      name: { type: string }
      url: { type: string, format: uri }
      type_channel:
        type: string
        description: Nền tảng kênh
        enum: [facebook, youtube, tiktok]
        example: youtube
      created_at: { type: string, format: date-time, nullable: true }
      updated_at: { type: string, format: date-time, nullable: true }
  YoutubeScrapeRequest:
    type: object
    required: [channel_id]
    properties:
      channel_id:
        type: array
        minItems: 1
        items: { type: integer, minimum: 1 }
        description: ID kênh YouTube trong bảng `channels`
        example: [5]
      maxResults:
        type: integer
        minimum: 1
        maximum: 50
        description: Số video tối đa mỗi kênh (mặc định SCRAPE_MAX_POSTS / 10)
        example: 10
  TikTokScrapeRequest:
    type: object
    required: [channel_id]
    properties:
      channel_id:
        type: array
        minItems: 1
        items: { type: integer, minimum: 1 }
        description: ID kênh TikTok trong bảng `channels`
        example: [8]
      maxResults:
        type: integer
        minimum: 1
        maximum: 50
        description: Số video tối đa mỗi kênh (mặc định 10)
        example: 10
      commentsPerPost:
        type: integer
        minimum: 0
        maximum: 100
        description: Số comment gốc mỗi video (mặc định 30)
      maxRepliesPerComment:
        type: integer
        minimum: 0
        maximum: 50
        description: Số reply mỗi comment gốc (mặc định 10)
  YoutubeRefreshTailRequest:
    type: object
    properties:
      batchSize:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
      headSize:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
        description: Top N video mới nhất mỗi kênh được bỏ qua (không refresh)
      offset:
        type: integer
        minimum: 0
        default: 0
  FacebookScrapeRequest:
    type: object
    required: [channel_id]
    properties:
      channel_id:
        type: array
        minItems: 1
        items: { type: integer, minimum: 1 }
        description: ID kênh Facebook trong bảng `channels`
        example: [2, 3]
      maxResults:
        type: integer
        minimum: 1
        maximum: 50
        description: Số bài tối đa mỗi kênh (mặc định 10)
        example: 10
      commentsPerPost:
        type: integer
        minimum: 0
        maximum: 100
        description: Số comment tối đa mỗi bài (mặc định 30)
      maxRepliesPerComment:
        type: integer
        minimum: 0
        maximum: 50
        description: Bật nested replies khi > 0 (mặc định 10)
  SubjectChannelIds:
    type: object
    properties:
      channel_ids:
        type: array
        items: { type: integer, minimum: 1 }
        description: ID kênh trong bảng channels
  ScraperChannelIds:
    type: object
    required: [channel_id]
    properties:
      channel_id:
        type: array
        minItems: 1
        items: { type: integer, minimum: 1 }
        description: ID kênh trong bảng channels (DB local)
  User:
    type: object
    properties:
      id: { type: integer }
      user_code: { type: string }
      user_name: { type: string }
      role: { $ref: '#/components/schemas/UserType' }
      status: { $ref: '#/components/schemas/UserStatus' }
      created_at: { type: string, format: date-time, nullable: true }
      updated_at: { type: string, format: date-time, nullable: true }
      deleted_at: { type: string, format: date-time, nullable: true }
